name: EPİAŞ Saatlik Veri Güncelleme

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas eptr2

      - name: Pipeline Betiğini Çalıştır
        env:
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
          TZ: 'Europe/Istanbul'
        run: |
          python update_pipeline.py

      - name: Güncellenen Dosyaları Kaydet (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add temiz_epias_uretim.csv saatlik_profil.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik veri güncellemesi [skip ci]" && git push)
