name: Günlük EPİAŞ Veri Güncelleme

on:
  schedule:
    # Her gün Türkiye saatiyle 01:00'de (UTC 22:00) otomatik çalışır
    - cron: '0 22 * * *'
  workflow_dispatch: # Elle tetikleme seçeneği

permissions:
  contents: write

jobs:
  update-epias:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install pandas requests

      - name: Güncelleme Betiğini Çalıştır
        run: |
          python update_pipeline.py

      - name: Değişiklikleri Repoya Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add temiz_epias_uretim.csv saatlik_profil.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Güncelleme: EPİAŞ saatlik verileri eklendi" && git push)
