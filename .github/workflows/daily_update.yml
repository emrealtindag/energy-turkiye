name: Günlük EPİAŞ Veri Güncelleme

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epias:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install pandas requests eptr2

      - name: Güncelleme Betiğini Çalıştır
        env:
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: |
          python update_pipeline.py

      - name: Değişiklikleri Repoya Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/temiz_epias_uretim.csv data/saatlik_profil.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Güncelleme: EPİAŞ saatlik verileri eklendi" && git push)
